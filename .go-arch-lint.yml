version: 3
workdir: .

allow:
  depOnAnyVendor: true
  ignoreNotFoundComponents: true
  deepScan: false

exclude:
  - cmd
  - internal
  - testutil
  - scripts
  - sdk
  - examples
  - .snow
  - vendor
  - docs
  - deployments
  - benchmarks
  - build
  - CC-Source
  - .ace-tool
  - .bug
  - .claude
  - .codex
  - .github
  - .omx
  - .vscode

excludeFiles:
  - '^.*_test\.go$'
  - '^.*[\\/]examples[\\/].*$'
  - '^.*[\\/]\.snow[\\/].*$'
  - '^.*[\\/]agentflow\.go$'
  - '^.*[\\/]doc\.go$'

components:
  types:
    in:
      - types
  config:
    in:
      - config
  llm:
    in:
      - llm/**
  agent:
    in:
      - agent/**
  rag:
    in:
      - rag/**
  workflow:
    in:
      - workflow/**
  api:
    in:
      - api/**
  pkg_common:
    in:
      - pkg/common
  pkg_httpclient:
    in:
      - pkg/httpclient
  pkg_httputil:
    in:
      - pkg/httputil
  pkg_cache:
    in:
      - pkg/cache
  pkg_database:
    in:
      - pkg/database
  pkg_jsonschema:
    in:
      - pkg/jsonschema
  pkg_jsonutil:
    in:
      - pkg/jsonutil
  pkg_metrics:
    in:
      - pkg/metrics
  pkg_middleware:
    in:
      - pkg/middleware
  pkg_migration:
    in:
      - pkg/migration
  pkg_mongodb:
    in:
      - pkg/mongodb
  pkg_openapi:
    in:
      - pkg/openapi
  pkg_server:
    in:
      - pkg/server
  pkg_service:
    in:
      - pkg/service
  pkg_scheduler:
    in:
      - pkg/scheduler
  pkg_storage:
    in:
      - pkg/storage
  pkg_telemetry:
    in:
      - pkg/telemetry
  pkg_tlsutil:
    in:
      - pkg/tlsutil
  pkg_tokenizer:
    in:
      - pkg/tokenizer/**

commonComponents:
  - types

deps:
  types:
    mayDependOn:
      - types
  config:
    mayDependOn:
      - config
      - pkg_httputil
      - types
  llm:
    anyProjectDeps: true
    # Coarse architecture component: dependency direction for this layer is enforced by architecture_guard_test.go and scripts/arch_guard.ps1.
  agent:
    anyProjectDeps: true
    # Coarse architecture component: dependency direction for this layer is enforced by architecture_guard_test.go and scripts/arch_guard.ps1.
  rag:
    anyProjectDeps: true
    # Coarse architecture component: dependency direction for this layer is enforced by architecture_guard_test.go and scripts/arch_guard.ps1.
  workflow:
    anyProjectDeps: true
    # Coarse architecture component: dependency direction for this layer is enforced by architecture_guard_test.go and scripts/arch_guard.ps1.
  api:
    anyProjectDeps: true
    # Coarse architecture component: dependency direction for this layer is enforced by architecture_guard_test.go and scripts/arch_guard.ps1.
  pkg_common:
    mayDependOn: [pkg_common, types]
  pkg_httpclient:
    mayDependOn: [pkg_httpclient, config, types]
  pkg_httputil:
    mayDependOn: [pkg_httputil, types]
  pkg_cache:
    mayDependOn: [pkg_cache, pkg_tlsutil, types]
  pkg_database:
    mayDependOn: [pkg_database, types]
  pkg_jsonschema:
    mayDependOn: [pkg_jsonschema, types]
  pkg_jsonutil:
    mayDependOn: [pkg_jsonutil, types]
  pkg_metrics:
    mayDependOn: [pkg_metrics, types]
  pkg_middleware:
    mayDependOn: [pkg_middleware, pkg_httputil, pkg_metrics, pkg_telemetry, config, types]
  pkg_migration:
    mayDependOn: [pkg_migration, config, types]
  pkg_mongodb:
    mayDependOn: [pkg_mongodb, pkg_tlsutil, config, types]
  pkg_openapi:
    mayDependOn: [pkg_openapi, pkg_tlsutil, types]
  pkg_server:
    mayDependOn: [pkg_server, pkg_tlsutil, types]
  pkg_service:
    mayDependOn: [pkg_service, types]
  pkg_scheduler:
    mayDependOn: [pkg_scheduler, types]
  pkg_storage:
    mayDependOn: [pkg_storage, pkg_tlsutil, types]
  pkg_telemetry:
    mayDependOn: [pkg_telemetry, config, types]
  pkg_tlsutil:
    mayDependOn: [pkg_tlsutil, types]
  pkg_tokenizer:
    mayDependOn: [pkg_tokenizer, types]

